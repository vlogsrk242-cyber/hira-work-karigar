workflows:
  android-release:
    name: Hira Work Karigar APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      groups:
        - firebase_credentials

    scripts:
      - name: Generate Android project
        script: |
          flutter create --platforms=android --org com.hirawork .

      - name: Add Firebase configuration
        script: |
          echo "$ANDROID_FIREBASE_JSON" > android/app/google-services.json

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
