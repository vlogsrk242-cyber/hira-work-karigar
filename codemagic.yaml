workflows:
  android-release:
    name: Hira Work Karigar APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Generate Android project
        script: |
          flutter create --platforms=android --org com.hirawork .

      - name: Add Firebase configuration
        script: |
          cp google-services.json android/app/google-services.json

      - name: Configure Google Services plugin
        script: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services") version "4.5.0" apply false''',
                  1
              )

          settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          app_text = app.read_text()

          if 'id("com.google.gms.google-services")' not in app_text:
              app_text = app_text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services")''',
                  1
              )

          app.write_text(app_text)
          PY

      - name: Get packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
